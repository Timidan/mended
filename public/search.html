<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search fixes | Mended</title>
  <meta name="description" content="Paste a Walrus Memory or Sui error and get the fix that worked.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="tool">
  <header class="nav">
    <a class="brand" href="/"><img src="/mark.svg" alt="" width="28" height="28"><span>Mended</span></a>
    <nav class="menu flat" aria-label="Main">
      <a href="/search" aria-current="page">Search</a>
      <a href="/fixes">Fixes</a>
      <a href="/search#mcp">MCP server</a>
    </nav>
    <span></span>
  </header>

  <main class="find">
    <section class="ask">
      <form id="ask">
        <h1><label for="error">Paste your error</label></h1>
        <textarea id="error" name="error" rows="8" spellcheck="false" required placeholder="401 AUTH_REJECTED, a Move abort, or a transaction digest"></textarea>
        <label for="address">Sui address, account ID or delegate public key</label>
        <input id="address" name="address" spellcheck="false" autocomplete="off" placeholder="0x…">
        <button class="btn solid" type="submit">Search fixes</button>
      </form>
      <p class="warn">Use public IDs only. Mended never needs a private key.</p>
    </section>

    <section class="result" aria-live="polite">
      <div class="examples" id="examples">
        <h2>Examples</h2>
        <button data-example="tx"><strong>Failed transaction</strong><span>An abort on Mainnet, decoded</span></button>
        <button data-example="key"><strong>Delegate key not registered</strong><span>An account checked against a key that isn't on it</span></button>
        <button data-example="network"><strong>Testnet ID on Mainnet</strong><span>Walrus Memory's Testnet package</span></button>
      </div>
      <div id="answer"></div>
    </section>

    <section class="agent" id="mcp">
      <h2>Install the MCP server</h2>
      <p>Add Mended to your coding agent so it can look up fixes when a Walrus Memory or Sui call fails.</p>
      <div class="commands">
        <div><h3>Claude Code</h3><code id="cmd-claude"></code><button class="copy" data-copy="cmd-claude">Copy</button></div>
        <div><h3>Codex</h3><code id="cmd-codex"></code><button class="copy" data-copy="cmd-codex">Copy</button></div>
      </div>
      <p class="also">Any other client that supports MCP over HTTP can use <code id="mcp-url"></code>.</p>
    </section>
  </main>

  <script src="/search.js" type="module"></script>
</body>
</html>
